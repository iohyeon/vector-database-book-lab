services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: vector_book_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_only_local_password
    ports:
      - "127.0.0.1:55443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d vector_book_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
